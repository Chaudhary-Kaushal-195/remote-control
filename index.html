<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Vice - Virtual Controller System</title>
    <style>
        body {
            background: #0a0015;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            border: 2px solid #f092ff;
            border-radius: 20px;
            background: rgba(255, 146, 255, 0.05);
            box-shadow: 0 0 50px rgba(240, 146, 255, 0.2);
            max-width: 500px;
        }

        h1 {
            color: #0ffffa;
            text-shadow: 0 0 15px #0ffffa;
            margin-bottom: 30px;
            font-size: 2.5em;
            letter-spacing: 2px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            font-size: 1.2em;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .btn-game {
            background: rgba(15, 255, 250, 0.1);
            border: 1px solid #0ffffa;
            color: #0ffffa;
        }

        .btn-game:hover {
            background: #0ffffa;
            color: #000;
            box-shadow: 0 0 20px #0ffffa;
        }

        .btn-control {
            background: rgba(240, 146, 255, 0.1);
            border: 1px solid #f092ff;
            color: #f092ff;
        }

        .btn-control:hover {
            background: #f092ff;
            color: #000;
            box-shadow: 0 0 20px #f092ff;
        }

        p {
            opacity: 0.6;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>DR. VICE</h1>
        <a href="cargame.html" class="btn btn-game">🎮 START CAR GAME</a>
        <a href="controller.html?mode=manual" class="btn btn-control">🤳 OPEN REMOTE APP</a>
        <p>A Professional Peer-to-Peer Controller System</p>
    </div>
</body>

</html>
