<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dr. Vice - Final Visual Build</title>
    <style>
        :root {
            --neon-blue: #0ffffa;
            --neon-pink: #f092ff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #05000a;
            font-family: 'Courier New', monospace;
            user-select: none;
            touch-action: none;
            color: #fff;
        }

        /* HUD - Exactly like top-left of reference image */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ffffa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 100;
            font-size: 18px;
            line-height: 1.4;
        }

        #hud b {
            color: #0ffffa;
            font-weight: 900;
        }

        #speed-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 0px 4px;
            color: #fff;
            font-size: 14px;
            margin-left: 5px;
            pointer-events: auto;
            cursor: pointer;
        }

        #speed-box:active {
            background: rgba(0, 255, 255, 0.2);
        }

        .hud-meta {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.7);
            white-space: pre;
            margin-top: 10px;
            font-weight: normal;
        }

        /* STEERING WHEEL - Realistic pink icon style from image */
        #steering-zone {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 140px;
            height: 140px;
            z-index: 50;
        }

        #wheel-visual {
            width: 100%;
            height: 100%;
            border: 3px solid #f092ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(240, 146, 255, 0.4);
            position: relative;
        }

        #wheel-visual::after {
            /* Inner ring */
            content: "";
            position: absolute;
            width: 88%;
            height: 88%;
            border: 1.5px solid #f092ff;
            border-radius: 50%;
            box-shadow: inset 0 0 5px rgba(240, 146, 255, 0.2);
        }

        .spoke-center {
            width: 30px;
            height: 22px;
            border: 2px solid #f092ff;
            border-radius: 50% 50% 40% 40%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .spoke-center::before {
            content: "";
            position: absolute;
            width: 12px;
            height: 3px;
            background: #f092ff;
            border-radius: 2px;
        }

        .spoke-hand {
            position: absolute;
            width: 68%;
            height: 38%;
            border: 2px solid #f092ff;
            border-radius: 30% 30% 70% 70%;
            top: 40%;
        }

        /* PEDALS - Matching exact icon shapes and glows */
        .ui-container {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            align-items: flex-end;
            gap: 30px;
        }

        .pedal {
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 2px solid;
            background: rgba(0, 0, 0, 0.5);
            font-size: 14px;
            position: relative;
        }

        .pedal-label {
            position: absolute;
            top: -25px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #fff;
            opacity: 0.9;
        }

        .clutch {
            width: 40px;
            height: 110px;
            border-color: #f092ff;
            box-shadow: 0 0 10px rgba(240, 146, 255, 0.3);
        }

        .clutch .stripe {
            width: 60%;
            height: 6px;
            border: 1.5px solid #f092ff;
            border-radius: 3px;
            margin: 4px 0;
        }

        #brake {
            width: 70px;
            height: 90px;
            border-color: #f092ff;
            color: #f092ff;
            box-shadow: 0 0 12px rgba(240, 146, 255, 0.4);
        }

        #brake .stripe {
            width: 60%;
            height: 8px;
            background: none;
            border: 1.5px solid #f092ff;
            border-radius: 3px;
            margin: 4px 0;
        }

        #brake .stripe.active {
            background: #f092ff;
        }

        #gas {
            width: 70px;
            height: 150px;
            color: #0ffffa;
            border: 2px solid;
            border-image: linear-gradient(to top, #0ffffa, #f092ff) 1;
            box-shadow: 0 0 15px rgba(15, 255, 250, 0.3);
        }

        #gas .stripe {
            width: 60%;
            height: 10px;
            border: 1.5px solid #0ffffa;
            border-radius: 3px;
            margin: 6px 0;
        }

        #gas .pedal-label {
            color: #f092ff;
            top: 12px;
            font-size: 14px;
            font-weight: 900;
        }

        /* Modern HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 0, 21, 0.85);
            border: 1px solid var(--neon-blue);
            padding: 15px;
            border-radius: 12px;
            z-index: 6000;
            backdrop-filter: blur(10px);
            min-width: 220px;
            box-shadow: 0 0 15px rgba(15, 255, 250, 0.2);
            pointer-events: auto;
        }

        /* Analog Dashboard Cluster */
        .dash-cluster {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 15px;
            z-index: 6000;
            pointer-events: none;
        }

        .gauge-pod {
            background: rgba(255, 255, 255, 0.05);
            /* Transparent */
            border: 2px solid rgba(15, 255, 250, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(15, 255, 250, 0.1);
            position: relative;
        }

        .gauge-main {
            width: 180px;
            height: 180px;
            border-width: 3px;
            border-color: var(--neon-blue);
        }

        .gauge-sub {
            width: 120px;
            height: 120px;
            border-color: rgba(240, 146, 255, 0.4);
        }

        .gauge-mini {
            width: 80px;
            height: 80px;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .gauge-needle {
            transition: transform 0.05s linear;
        }

        .dash-label {
            position: absolute;
            bottom: 25px;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .gear-display {
            position: absolute;
            bottom: 50px;
            font-size: 32px;
            font-weight: 900;
            color: var(--neon-pink);
            text-shadow: 0 0 15px var(--neon-pink);
        }

        #pause-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 6001;
        }

        #qr-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 0, 21, 0.95);
            padding: 30px;
            border: 2px solid #f092ff;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(240, 146, 255, 0.5);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        #qr-code {
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .qr-close {
            margin-top: 15px;
            color: #f092ff;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Sound Overlay */
        #sound-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 5000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-align: center;
        }

        #sound-overlay h1 {
            color: #0ffffa;
            margin: 0;
        }

        #sound-overlay p {
            color: #f092ff;
            margin-top: 10px;
        }

        /* Pause Overlay */
        #pause-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 0, 21, 0.85);
            backdrop-filter: blur(8px);
            z-index: 7000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .pause-content {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--neon-blue);
            text-align: center;
            box-shadow: 0 0 50px rgba(15, 255, 250, 0.2);
        }

        /* Settings Modal */
        #settings-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 8000;
            /* Increased to be above pause overlay */
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: rgba(10, 0, 20, 0.9);
            border: 1px solid rgba(15, 255, 250, 0.3);
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(15, 255, 250, 0.1);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .setting-label {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        select,
        input[type="range"] {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 5px 10px;
            border-radius: 8px;
            font-family: inherit;
        }

        .close-modal-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: var(--neon-blue);
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
            transition: 0.3s;
        }

        .close-modal-btn:hover {
            box-shadow: 0 0 15px var(--neon-blue);
            transform: scale(1.02);
        }

        /* Responsive Scaling for Small Screens & Mobile Landscape */
        @media (max-width: 900px),
        (max-height: 500px) {
            #hud {
                transform: scale(0.6);
                transform-origin: top left;
                top: 5px;
                left: 5px;
                min-width: 150px;
                padding: 10px;
            }

            .dash-cluster {
                transform: translateX(-50%) scale(0.45);
                transform-origin: bottom center;
                bottom: 0px;
                gap: 5px;
            }

            .ui-container {
                transform: scale(0.55);
                transform-origin: bottom right;
                bottom: 5px;
                right: 5px;
                gap: 15px;
            }

            #steering-zone {
                transform: scale(0.5);
                transform-origin: bottom left;
                bottom: 5px;
                left: 5px;
            }

            #pause-btn {
                transform: scale(0.7);
                top: 5px;
                right: 5px;
            }

            .modal-content {
                width: 95%;
                padding: 15px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

    <div id="hud">
        <b style="color:#0ffffa; letter-spacing:1px; font-size:12px;"># DR. VICE PRO RACING</b><br>
        <div id="speed-box" style="font-size: 28px; margin-top:5px; font-weight:900; color:#fff;">0 KPH</div>
        <div id="unit-label" style="font-size: 10px; opacity:0.6; margin-bottom:10px;">unit: KPH</div>

        <div style="display:flex; gap:10px;">
            <button class="hud-btn" id="cam-btn" onclick="initAudio(); cycleCamera();">🎥 VIEW: NORMAL</button>
            <button id="remote-box" class="hud-btn" onclick="initAudio(); setupRemote();">🤳 SYNC PHONE</button>
        </div>
    </div>

    <div class="dash-cluster">
        <!-- TEMP GAUGE -->
        <div class="gauge-pod gauge-mini">
            <svg width="70" height="70" viewBox="0 0 100 100">
                <path d="M 25 75 A 35 35 0 1 1 75 75" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="6"
                    stroke-linecap="round" />
                <g id="temp-needle-grp" transform="rotate(-90, 50, 50)">
                    <path d="M 50 50 L 48 50 L 50 20 L 52 50 Z" fill="#ff4400" />
                </g>
            </svg>
            <div class="dash-label" style="bottom:12px; font-size:8px;">TEMP</div>
        </div>

        <!-- FUEL GAUGE -->
        <div class="gauge-pod gauge-sub">
            <svg width="100" height="100" viewBox="0 0 100 100">
                <path d="M 25 75 A 35 35 0 1 1 75 75" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"
                    stroke-linecap="round" />
                <g id="fuel-needle-grp" transform="rotate(45, 50, 50)">
                    <path d="M 50 50 L 47 50 L 50 15 L 53 50 Z" fill="#ffaa00" />
                </g>
            </svg>
            <div class="dash-label">FUEL</div>
        </div>

        <!-- MAIN SPEEDO -->
        <div class="gauge-pod gauge-main">
            <svg width="160" height="160" viewBox="0 0 100 100">
                <!-- Re-calculated Arc for perfect (50,50) center -->
                <path d="M 21.7 78.3 A 40 40 0 1 1 78.3 78.3" fill="none" stroke="rgba(255,255,255,0.1)"
                    stroke-width="8" stroke-linecap="round" />
                <path id="speed-arc" d="M 21.7 78.3 A 40 40 0 1 1 78.3 78.3" fill="none" stroke="var(--neon-blue)"
                    stroke-width="8" stroke-linecap="round" stroke-dasharray="188" stroke-dashoffset="188" />

                <g id="speed-needle-grp" transform="rotate(-120, 50, 50)">
                    <path d="M 50 50 L 46 50 L 50 12 L 54 50 Z" fill="var(--neon-pink)" />
                </g>
                <circle cx="50" cy="50" r="6" fill="var(--neon-pink)" />
                <text x="50" y="80" text-anchor="middle" fill="#fff" font-size="10" font-weight="900"
                    opacity="0.4">MPH</text>
            </svg>
            <div id="gear-box" class="gear-display">N</div>
        </div>

        <!-- TACHOMETER (RPM) -->
        <div class="gauge-pod gauge-sub">
            <svg width="100" height="100" viewBox="0 0 100 100">
                <path d="M 25 75 A 35 35 0 1 1 75 75" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"
                    stroke-linecap="round" />
                <path d="M 70 30 A 35 35 0 0 1 75 75" fill="none" stroke="#ff0000" stroke-width="8"
                    stroke-linecap="round" opacity="0.4" />
                <g id="rpm-needle-grp" transform="rotate(-110, 50, 50)">
                    <path d="M 50 50 L 47 50 L 50 15 L 53 50 Z" fill="#0ffffa" />
                </g>
            </svg>
            <div class="dash-label">RPM</div>
        </div>
    </div>

    <div id="pause-overlay">
        <div class="pause-content">
            <h1 style="color:var(--neon-blue); margin-bottom:10px;">GAME PAUSED</h1>
            <p style="color:#fff; opacity:0.7; margin-bottom:30px;">TAKE A BREATH, CHAMP.</p>

            <div style="display:flex; flex-direction:column; gap:15px; width:200px; margin:0 auto;">
                <button class="hud-btn" style="padding:15px; font-size:16px;" onclick="togglePause()">RESUME
                    RACE</button>
                <button class="hud-btn"
                    style="padding:15px; font-size:16px; border-color:var(--neon-pink); color:var(--neon-pink);"
                    onclick="toggleSettings()">⚙️ SETTINGS</button>
                <button class="hud-btn" style="padding:10px; opacity:0.6; font-size:12px;"
                    onclick="window.location.href='index.html'">EXIT TO HUB</button>
            </div>
        </div>
    </div>

    <button id="pause-btn" class="hud-btn" onclick="togglePause()">⏸ PAUSE</button>

    <div id="sound-overlay" onclick="initAudio()">
        <h1>🏎️ DR. VICE</h1>
        <p>TAP TO START SOUND & ENGINE</p>
    </div>

    <div id="qr-overlay">
        <h2 style="color:#0ffffa; margin-top:0;">SCAN TO CONNECT</h2>
        <div id="qr-code"></div>
        <p style="font-size:12px; opacity:0.8;">SCAN WITH PHONE CAMERA TO USE AS CONTROLLER</p>
        <div class="qr-close" onclick="document.getElementById('qr-overlay').style.display='none'">CLOSE</div>
    </div>

    <!-- IN-GAME SETTINGS MODAL -->
    <div id="settings-modal" onclick="event.target === this && toggleSettings()">
        <div class="modal-content">
            <h2 style="margin-top:0; color:var(--neon-blue); letter-spacing:2px;">LIVE SETTINGS</h2>

            <div class="setting-row">
                <div class="setting-label">Steering Mode</div>
                <select id="setting-steering" onchange="saveSettings()">
                    <option value="wheel">Analog Wheel</option>
                    <option value="buttons">Left/Right Buttons</option>
                    <option value="gyro">Gyro Only (Pro)</option>
                </select>
            </div>

            <div class="setting-row">
                <div class="setting-label">Speed Format</div>
                <select id="setting-units" onchange="saveSettings()">
                    <option value="kph">KPH (Kilometers)</option>
                    <option value="mph">MPH (Miles)</option>
                </select>
            </div>

            <div class="setting-row">
                <div class="setting-label">Engine Volume</div>
                <input type="range" id="setting-engine-vol" min="0" max="100" value="80" oninput="saveSettings()">
            </div>

            <div class="setting-row">
                <div class="setting-label">Music Volume</div>
                <input type="range" id="setting-music-vol" min="0" max="100" value="50" oninput="saveSettings()">
            </div>

            <button class="close-modal-btn" onclick="toggleSettings()">RESUME WITH UPDATES</button>
        </div>
    </div>

    <div id="steering-zone">
        <div id="wheel-visual">
            <div class="spoke-center"></div>
            <div class="spoke-hand"></div>
        </div>
    </div>

    <div class="ui-container">
        <div class="pedal clutch">
            <div class="stripe"></div>
            <div class="stripe"></div>
        </div>
        <div id="brake" class="pedal">
            <div class="pedal-label" style="color:#0ffffa">#Gas</div>
            <div class="stripe"></div>
            <div class="stripe active"></div>
            <div class="stripe"></div>
        </div>
        <div id="gas" class="pedal">
            <div class="pedal-label">GAS</div>
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
            <div class="stripe"></div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EngineSoundSystem } from './EngineSoundSystem.js';

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05000a);
        scene.fog = new THREE.FogExp2(0x05000a, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let isPaused = false;
        let fuelLevel = 100;
        let engineTemp = 20; // Starts cold
        let rpm = 0;

        window.togglePause = () => {
            isPaused = !isPaused;
            document.getElementById('pause-btn').innerText = isPaused ? "▶ RESUME" : "⏸ PAUSE";
            const overlay = document.getElementById('pause-overlay');
            if (overlay) overlay.style.display = isPaused ? 'flex' : 'none';
        };

        // --- GLOBAL SETTINGS & SYNC ---
        let gameSettings = {
            steering: 'wheel',
            units: 'kph',
            engineVol: 80,
            musicVol: 50
        };

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            const isVisible = modal.style.display === 'flex';
            if (isVisible) {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'flex';
                loadSettingsToModal();
            }
        }

        function saveSettings() {
            gameSettings.steering = document.getElementById('setting-steering').value;
            gameSettings.units = document.getElementById('setting-units').value;
            gameSettings.engineVol = document.getElementById('setting-engine-vol').value;
            gameSettings.musicVol = document.getElementById('setting-music-vol').value;

            localStorage.setItem('drViceSettings', JSON.stringify(gameSettings));
            // Apply live engine volume is handled dynamically in EngineSoundSystem update
        }

        function loadSettingsToModal() {
            const saved = localStorage.getItem('drViceSettings');
            if (saved) {
                const s = JSON.parse(saved);
                document.getElementById('setting-steering').value = s.steering || 'wheel';
                document.getElementById('setting-units').value = s.units || 'kph';
                document.getElementById('setting-engine-vol').value = s.engineVol || 80;
                document.getElementById('setting-music-vol').value = s.musicVol || 50;
                gameSettings = s;
            }
        }
        loadSettingsToModal();

        // --- CAMERA MODES ---
        let cameraMode = 0; // 0: Normal, 1: Inside, 2: Near
        const cameraModes = ["NORMAL", "INSIDE", "ACTION"];

        window.cycleCamera = () => {
            cameraMode = (cameraMode + 1) % 3;
            const btn = document.getElementById('cam-btn');
            if (btn) btn.innerText = `🎥 VIEW: ${cameraModes[cameraMode]}`;
        };

        scene.add(new THREE.GridHelper(2000, 100, 0x00ffff, 0x222222));
        scene.add(new THREE.AmbientLight(0xffffff, 1.0));

        // --- CAR ASSEMBLY (BMW E30 NEON) ---
        const car = new THREE.Group();
        const paintMat = new THREE.MeshStandardMaterial({ color: 0xc1006e, roughness: 0.2, metalness: 0.8 });
        const cyanNeon = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const windowMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0, metalness: 1, transparent: true, opacity: 0.8 });
        const tailMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });

        // Chassis - Main Body
        const bodyGeo = new THREE.BoxGeometry(2.0, 0.7, 4.2);
        const bodyMesh = new THREE.Mesh(bodyGeo, paintMat);
        bodyMesh.position.y = 0.6;
        car.add(bodyMesh);

        // Cabin (E30 Boxy Style)
        const cabinGeo = new THREE.BoxGeometry(1.7, 0.6, 2.0);
        const cabinMesh = new THREE.Mesh(cabinGeo, paintMat);
        cabinMesh.position.set(0, 1.25, -0.1);
        car.add(cabinMesh);

        // Windows with Cyan Outline
        const winGeo = new THREE.BoxGeometry(1.72, 0.5, 1.8);
        const winMesh = new THREE.Mesh(winGeo, windowMat);
        winMesh.position.set(0, 1.25, -0.1);
        car.add(winMesh);

        // Neon Trims (Windows)
        const winTrim = new THREE.Mesh(new THREE.BoxGeometry(1.73, 0.05, 1.82), cyanNeon);
        winTrim.position.set(0, 1.0, -0.1); car.add(winTrim);
        const winTrim2 = winTrim.clone(); winTrim2.position.y = 1.5; car.add(winTrim2);

        // Colorful Underglow (Enhanced Movement Aware)
        const underglowGroup = new THREE.Group();
        const colors = [0x0ffffa, 0xf092ff, 0xffaa00, 0x00ff00, 0xff00ff, 0x00ffff];
        const underglowStrips = [];
        for (let i = 0; i < 15; i++) {
            const stripGeo = new THREE.BoxGeometry(2.2, 0.02, 0.15);
            const stripMat = new THREE.MeshBasicMaterial({ color: colors[i % colors.length], transparent: true, opacity: 0.9 });
            const strip = new THREE.Mesh(stripGeo, stripMat);
            strip.position.set(0, 0.22, (i * 0.3) - 2.2);
            underglowGroup.add(strip);
            underglowStrips.push(strip);
        }
        car.add(underglowGroup);

        // Bumpers & Mirrors
        const bumper = new THREE.Mesh(new THREE.BoxGeometry(2.05, 0.25, 0.15), paintMat);
        bumper.position.set(0, 0.45, 2.1); car.add(bumper);
        const bumperR = bumper.clone(); bumperR.position.z = -2.11; car.add(bumperR);

        const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.18, 0.1), paintMat);
        mirror.position.set(1.1, 1.1, 0.7); car.add(mirror);
        const mirrorL = mirror.clone(); mirrorL.position.x = -1.1; car.add(mirrorL);

        // Taillights (More detailed E30 style)
        const tlGroup = new THREE.Group();
        const tlMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.1), tailMat);
        const tlOrange = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.3, 0.11), new THREE.MeshBasicMaterial({ color: 0xffaa00 }));
        tlOrange.position.x = 0.15; tlMesh.add(tlOrange);
        tlGroup.add(tlMesh);

        const tlL = tlGroup.clone(); tlL.position.set(0.65, 0.65, -2.12); car.add(tlL);
        const tlR = tlGroup.clone(); tlR.position.set(-0.65, 0.65, -2.12); car.add(tlR);

        // WHEELS (BMW Neon Logo Style)
        const wheels = [];
        const wGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.5, 32);
        wGeo.rotateZ(Math.PI / 2);
        [{ x: 1.0, z: 1.3 }, { x: -1.0, z: 1.3 }, { x: 1.0, z: -1.3 }, { x: -1.0, z: -1.3 }].forEach((p) => {
            const anchor = new THREE.Group(); anchor.position.set(p.x, 0.55, p.z);
            const roller = new THREE.Group();
            roller.add(new THREE.Mesh(wGeo, new THREE.MeshStandardMaterial({ color: 0x111111 })));

            // Neon Strips across the tire (Left to Right)
            const stripCount = 8;
            for (let j = 0; j < stripCount; j++) {
                const angle = (j / stripCount) * Math.PI * 2;
                const stripGeo = new THREE.BoxGeometry(0.52, 0.03, 0.15);
                const stripMat = new THREE.MeshBasicMaterial({ color: (j % 2 === 0) ? 0x0ffffa : 0xf092ff });
                const strip = new THREE.Mesh(stripGeo, stripMat);
                strip.position.set(0, Math.cos(angle) * 0.56, Math.sin(angle) * 0.56);
                strip.rotation.x = angle;
                roller.add(strip);
            }

            // BMW Logo
            const logo = new THREE.Group();
            const qGeo = new THREE.CircleGeometry(0.48, 32, 0, Math.PI / 2);
            for (let i = 0; i < 4; i++) {
                const q = new THREE.Mesh(qGeo, (i % 2 === 0) ? new THREE.MeshBasicMaterial({ color: 0xffffff }) : new THREE.MeshBasicMaterial({ color: 0x0044aa }));
                q.rotation.y = Math.PI / 2; q.rotation.x = -i * (Math.PI / 2);
                logo.add(q);
            }
            logo.position.x = (p.x > 0) ? 0.28 : -0.28;
            if (p.x < 0) logo.rotation.y = Math.PI;
            roller.add(logo); anchor.add(roller); car.add(anchor);
            wheels.push({ anchor, roller });
        });

        // --- EXHAUST & BACKFIRE ---
        const exhaust = new THREE.Group();
        exhaust.position.set(0.65, 0.45, -2.12); // Right side exhaust
        car.add(exhaust);

        const backfireLight = new THREE.PointLight(0xff5500, 0, 5);
        exhaust.add(backfireLight);

        const flameGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0 });
        const flame = new THREE.Mesh(flameGeo, flameMat);
        exhaust.add(flame);

        scene.add(car);

        // --- REMOTE SYNC (PEERJS) ---
        let peer = null, conn = null;
        const remoteBox = document.getElementById('remote-box');
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role'); // 'controller'
        const hostId = urlParams.get('hostId');

        window.setupRemote = () => {
            if (peer) {
                document.getElementById('qr-overlay').style.display = 'flex';
                return;
            }
            if (window.location.protocol === 'file:') {
                alert("CRITICAL: You are running this as a local file. Your phone CANNOT connect to a 'file://' link. \n\n Please use: http://localhost:8000/cargame.html instead!");
                return;
            }
            peer = new Peer();
            peer.on('open', (id) => {
                console.log('Laptop Peer ID:', id);

                // Auto-detect the base URL for the controller app
                const baseUrl = window.location.href.split('cargame.html')[0] + 'controller.html';
                const url = `${baseUrl}?hostId=${id}`;
                remoteBox.innerText = `ID: ${id} (CLICK FOR QR)`;
                remoteBox.style.background = "rgba(0, 255, 255, 0.1)";
                remoteBox.style.color = "#0ffffa";

                // Generate QR Code (ID only)
                const qrContainer = document.getElementById('qr-code');
                qrContainer.innerHTML = "";
                new QRCode(qrContainer, {
                    text: id, // Just the ID
                    width: 200,
                    height: 200,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                remoteBox.onclick = () => {
                    document.getElementById('qr-overlay').style.display = 'flex';
                };
            });
            peer.on('error', (err) => {
                console.error('PeerJS Error:', err);
                remoteBox.innerText = "REMOTE ERROR: " + err.type;
                remoteBox.style.background = "rgba(255, 0, 0, 0.2)";
                alert("Connection Error: Check if you have internet for signaling server.");
            });
            peer.on('connection', (c) => {
                conn = c;
                remoteBox.innerText = "CONTROLLER CONNECTED";

                // SEND CONFIG TO CONTROLLER
                conn.on('open', () => {
                    conn.send({ type: 'config', config: gameSettings });
                });

                conn.on('data', (data) => {
                    if (data.type === 'gyro') {
                        gyroActive = true;
                        gyroTilt = (data.tilt || 0);
                    }
                    if (data.type === 'pedal') {
                        inputs[data.pedal] = data.active;
                    }
                });
            });
        };

        if (role === 'controller') {
            document.body.style.background = "#1a002a";
            // Hide 3D game for controller mode
            setTimeout(() => {
                if (renderer && renderer.domElement) renderer.domElement.style.display = 'none';
                const hud = document.getElementById('hud');
                if (hud) hud.style.display = 'none';
            }, 100);

            const startController = (id) => {
                peer = new Peer();
                peer.on('open', () => {
                    conn = peer.connect(id);
                    conn.on('open', () => {
                        alert("CONNECTED! Tilt phone to steer.");
                        gyroActive = true;
                        window.addEventListener('deviceorientation', (e) => {
                            let tilt = -e.gamma;
                            if (window.orientation === 90) tilt = e.beta;
                            if (window.orientation === -90) tilt = -e.beta;
                            conn.send({ type: 'gyro', tilt: Math.max(-45, Math.min(45, tilt)) * 4 });
                        }, true);
                    });
                    conn.on('close', () => alert("Link Lost"));
                });
            };

            if (hostId) {
                startController(hostId);
            } else {
                const manualId = prompt("Enter the ID shown on your Laptop screen:");
                if (manualId) startController(manualId);
            }

            // Override pedal listeners to send data
            window.addEventListener('touchstart', (e) => {
                for (let t of e.changedTouches) {
                    if (t.target.closest('#gas')) conn?.send({ type: 'pedal', pedal: 'fwd', active: true });
                    if (t.target.closest('#brake')) conn?.send({ type: 'pedal', pedal: 'bwd', active: true });
                }
            });
            window.addEventListener('touchend', (e) => {
                for (let t of e.changedTouches) {
                    if (t.target.closest('#gas')) conn?.send({ type: 'pedal', pedal: 'fwd', active: false });
                    if (t.target.closest('#brake')) conn?.send({ type: 'pedal', pedal: 'bwd', active: false });
                }
            });
        }

        // --- CONTROLS ---
        let speed = 0, wheelAngle = 0, activeId = null, lastAngle = 0;
        let gyroActive = false, gyroTilt = 0;
        const inputs = { fwd: false, bwd: false, left: false, right: false, brake: false };
        const wheelZone = document.getElementById('steering-zone'), visual = document.getElementById('wheel-visual');
        const speedBox = document.getElementById('speed-box');

        window.toggleGyro = async () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') startGyro();
                } catch (e) { console.error(e); }
            } else {
                startGyro();
            }
        };

        function startGyro() {
            gyroActive = !gyroActive;
            if (gyroActive) {
                window.addEventListener('deviceorientation', handleGyro, true);
                speedBox.style.borderColor = "#0ffffa";
            } else {
                window.removeEventListener('deviceorientation', handleGyro, true);
                speedBox.style.borderColor = "rgba(255,255,255,0.4)";
                gyroTilt = 0;
            }
        }

        function handleGyro(e) {
            // landspace orientation: tilt is around the vertical axis
            let tilt = -e.gamma; // Inverted
            if (window.orientation === 90) tilt = e.beta; // Inverted from -e.beta
            if (window.orientation === -90) tilt = -e.beta; // Inverted from e.beta
            gyroTilt = Math.max(-45, Math.min(45, tilt)) * 4;
        }

        // --- MOUSE/TOUCH ORBIT ---
        let orbitX = 0, orbitY = 0.5, isOrbiting = false;
        window.addEventListener('mousedown', () => isOrbiting = true);
        window.addEventListener('mouseup', () => isOrbiting = false);
        window.addEventListener('mousemove', (e) => {
            if (isOrbiting) {
                orbitX -= e.movementX * 0.005;
                orbitY = Math.max(0.1, Math.min(1.5, orbitY + e.movementY * 0.005));
            }
        });

        const getAngle = (tx, ty) => {
            const r = wheelZone.getBoundingClientRect();
            return Math.atan2(ty - (r.top + r.height / 2), tx - (r.left + r.width / 2));
        };

        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isOrbiting = true;
            } else {
                for (let t of e.changedTouches) {
                    if (t.target.closest('#gas')) inputs.fwd = true;
                    if (t.target.closest('#brake')) inputs.bwd = true;
                    const r = wheelZone.getBoundingClientRect();
                    if (t.clientX >= r.left && t.clientX <= r.right && t.clientY >= r.top && t.clientY <= r.bottom) {
                        activeId = t.identifier; lastAngle = getAngle(t.clientX, t.clientY);
                    }
                }
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (isOrbiting && e.touches.length === 2) {
                // Orbit logic for 2-finger touch
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                orbitX += dx * 0.0001;
            } else {
                for (let t of e.changedTouches) {
                    if (t.identifier === activeId) {
                        const cur = getAngle(t.clientX, t.clientY);
                        let d = cur - lastAngle;
                        if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2;
                        wheelAngle = Math.max(-180, Math.min(180, wheelAngle + (d * 180 / Math.PI) * 1.3));
                        visual.style.transform = `rotate(${wheelAngle}deg)`;
                        lastAngle = cur;
                    }
                }
            }
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) isOrbiting = false;
            for (let t of e.changedTouches) {
                if (t.target.closest('#gas')) inputs.fwd = false;
                if (t.target.closest('#brake')) inputs.bwd = false;
                if (t.identifier === activeId) activeId = null;
            }
        });

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'w', 'W'].includes(e.key)) inputs.fwd = true;
            if (['ArrowDown', 's', 'S'].includes(e.key)) inputs.bwd = true;
            if (['ArrowLeft', 'a', 'A'].includes(e.key)) inputs.left = true;
            if (['ArrowRight', 'd', 'D'].includes(e.key)) inputs.right = true;
            if (e.key === ' ') { inputs.brake = true; e.preventDefault(); }
            if (e.key.toLowerCase() === 'c') cycleCamera();
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowUp', 'w', 'W'].includes(e.key)) inputs.fwd = false;
            if (['ArrowDown', 's', 'S'].includes(e.key)) inputs.bwd = false;
            if (['ArrowLeft', 'a', 'A'].includes(e.key)) inputs.left = false;
            if (['ArrowRight', 'd', 'D'].includes(e.key)) inputs.right = false;
            if (e.key === ' ') inputs.brake = false;
        });

        // --- AUDIO ENGINE ---
        let isAudioInit = false;
        let engineSoundSystem = null;

        window.initAudio = () => {
            const overlay = document.getElementById('sound-overlay');
            if (overlay) overlay.style.display = 'none';
            if (!engineSoundSystem) {
                engineSoundSystem = new EngineSoundSystem(camera, car);
                isAudioInit = true;
                window.engineSoundSystem = engineSoundSystem;
            } else if (engineSoundSystem.audioContext.state === 'suspended') {
                engineSoundSystem.audioContext.resume();
            }
        };

        let backfireTick = 0;
        window.triggerBackfireVisual = function () {
            backfireTick = 10; // visual flame only
        };

        function animate() {
            requestAnimationFrame(animate);
            if (isPaused) {
                renderer.render(scene, camera);
                return;
            }
            if (activeId === null) {
                if (gyroActive) {
                    wheelAngle = wheelAngle * 0.9 + gyroTilt * 0.1; // smoothed
                } else if (inputs.left) {
                    wheelAngle = Math.max(-180, wheelAngle - 5);
                } else if (inputs.right) {
                    wheelAngle = Math.min(180, wheelAngle + 5);
                } else {
                    wheelAngle *= 0.88;
                }
                visual.style.transform = `rotate(${wheelAngle}deg)`;
            }

            // Physics
            if (inputs.fwd) speed += 0.009;
            if (inputs.bwd) speed -= 0.009; // Reverse is slower now

            // Brake Logic
            if (inputs.brake) {
                if (speed > 0) speed = Math.max(0, speed - 0.02);
                if (speed < 0) speed = Math.min(0, speed + 0.02);
            }

            speed *= 0.985; // Natural friction

            car.translateZ(speed);
            car.rotation.y -= (wheelAngle / 180) * 0.05 * (speed * 4);

            wheels.forEach((w, i) => {
                w.roller.rotation.x += speed * 3.5;
                if (i < 2) w.anchor.rotation.y = -(wheelAngle / 180) * 0.7;
            });

            // Camera System
            let camTarget = new THREE.Vector3();
            let camPos = new THREE.Vector3();

            if (cameraMode === 0) { // NORMAL
                camPos.set(0, 4, -9);
                camTarget.set(0, 0.5, 0);
            } else if (cameraMode === 1) { // INSIDE
                camPos.set(0, 1.3, 0.5);
                camTarget.set(0, 1.2, 5);
            } else { // ACTION (Near)
                camPos.set(0, 2, -6);
                camTarget.set(0, 0.5, 0);
            }

            // Apply Orbit Rotation
            const orbitMatrix = new THREE.Matrix4().makeRotationY(orbitX);
            camPos.applyMatrix4(orbitMatrix);

            const worldPos = camPos.applyMatrix4(car.matrixWorld);
            const worldTarget = camTarget.applyMatrix4(car.matrixWorld);

            camera.position.lerp(worldPos, 0.12);
            camera.lookAt(worldTarget);

            renderer.render(scene, camera);

            // HUD Units Logic
            const rawSpeed = Math.abs(speed * 200);
            const displaySpeed = gameSettings.units === 'mph' ? Math.round(rawSpeed * 0.62) : Math.round(rawSpeed);
            speedBox.innerText = `${displaySpeed} ${gameSettings.units.toUpperCase()}`;
            document.getElementById('unit-label').innerText = `unit: ${gameSettings.units.toUpperCase()}`;

            // Analog Needle & Arc Logic (Multi-Gauge Clusters)
            const maxSpeed = 200;
            const needleAngle = -120 + ((rawSpeed / maxSpeed) * 240);
            const speedNeedleGrp = document.getElementById('speed-needle-grp');
            if (speedNeedleGrp) speedNeedleGrp.setAttribute('transform', `rotate(${needleAngle}, 50, 50)`);

            const arc = document.getElementById('speed-arc');
            if (arc) {
                const offset = 188 - (Math.min(1, rawSpeed / maxSpeed) * 188);
                arc.style.strokeDashoffset = offset;
            }

            // RPM Logic (Simulated)
            let targetRpm = 800 + (rawSpeed * 40);
            if (inputs.fwd) targetRpm += 3000 * (1 - (rawSpeed / maxSpeed));
            rpm = THREE.MathUtils.lerp(rpm, targetRpm, 0.1);
            const rpmAngle = -120 + ((rpm / 8000) * 240);
            const rpmNeedleGrp = document.getElementById('rpm-needle-grp');
            if (rpmNeedleGrp) rpmNeedleGrp.setAttribute('transform', `rotate(${rpmAngle}, 50, 50)`);

            // Fuel Logic (Slow depletion)
            if (rawSpeed > 1) fuelLevel -= 0.0005;
            const fuelAngle = 45 - (fuelLevel / 100 * 90);
            const fuelNeedleGrp = document.getElementById('fuel-needle-grp');
            if (fuelNeedleGrp) fuelNeedleGrp.setAttribute('transform', `rotate(${fuelAngle}, 50, 50)`);

            // Temp Logic (Warming up)
            if (rawSpeed > 1 && engineTemp < 90) engineTemp += 0.002;
            else if (engineTemp > 20) engineTemp -= 0.001;
            const tempAngle = -90 + ((engineTemp / 120) * 180);
            const tempNeedleGrp = document.getElementById('temp-needle-grp');
            if (tempNeedleGrp) tempNeedleGrp.setAttribute('transform', `rotate(${tempAngle}, 50, 50)`);

            // Gear Logic
            let gear = "N";
            if (speed < -0.01) {
                gear = "R";
            } else if (rawSpeed > 0.1) {
                if (rawSpeed < 30) gear = "1";
                else if (rawSpeed < 65) gear = "2";
                else if (rawSpeed < 100) gear = "3";
                else if (rawSpeed < 140) gear = "4";
                else gear = "5";
            }
            document.getElementById('gear-box').innerText = gear;

            // Backfire Logic is now handled via Sound Engine (triggerBackfireVisual)

            if (backfireTick > 0) {
                backfireTick--;
                backfireLight.intensity = 5 * (backfireTick / 10);
                flame.scale.setScalar(1 + Math.random() * 2);
                flame.material.opacity = (backfireTick / 10);
            } else {
                backfireLight.intensity = 0;
                flame.material.opacity = 0;
            }

            // Animate Colorful Underglow (Scrolling + Idle Shimmer)
            const shimmer = Math.sin(Date.now() * 0.005) * 0.1;
            underglowStrips.forEach((strip, idx) => {
                strip.position.z -= (speed * 2) + (shimmer * 0.1);
                strip.material.opacity = 0.6 + (Math.sin(Date.now() * 0.003 + idx) * 0.2);
                if (strip.position.z < -2) strip.position.z = 1.8;
                if (strip.position.z > 1.8) strip.position.z = -2;
            });

            if (engineSoundSystem) {
                engineSoundSystem.setThrottle(inputs.fwd ? 1.0 : 0.0);

                let gearIndex = 1;
                if (gear === "2") gearIndex = 2;
                else if (gear === "3") gearIndex = 3;
                else if (gear === "4") gearIndex = 4;
                else if (gear === "5") gearIndex = 5;
                engineSoundSystem.shiftGear('set', gearIndex);

                engineSoundSystem.update(0.016, speed * 200);
            }
        }
        animate();
    </script>
</body>

</html>
