<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Dr. Control - Universal Remote</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0015;
            color: #fff;
            font-family: 'Courier New', monospace;
            user-select: none;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #status {
            position: absolute;
            top: 10px;
            font-size: 14px;
            color: #f092ff;
            text-shadow: 0 0 10px #f092ff;
        }

        /* Controller Layout */
        #ui-container {
            display: flex;
            width: 90%;
            justify-content: space-between;
            align-items: flex-end;
        }

        /* Analog Stick / Wheel Visual */
        #wheel-zone {
            width: 140px;
            height: 140px;
            border: 3px solid #f092ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(240, 146, 255, 0.4);
        }

        #wheel-inner {
            width: 40px;
            height: 40px;
            background: #f092ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #f092ff;
            transition: transform 0.1s;
        }

        /* Pedals */
        .pedal-group {
            display: flex;
            gap: 30px;
            align-items: flex-end;
        }

        .pedal {
            width: 70px;
            border-radius: 12px;
            border: 3px solid;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
        }

        #brake {
            height: 100px;
            border-color: #f092ff;
            color: #f092ff;
            box-shadow: 0 0 15px rgba(240, 146, 255, 0.4);
        }

        #gas {
            height: 160px;
            border-color: #0ffffa;
            color: #0ffffa;
            box-shadow: 0 0 15px rgba(15, 255, 250, 0.4);
        }

        .pedal:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.1);
        }

        .label {
            position: absolute;
            top: -30px;
            font-size: 12px;
            letter-spacing: 2px;
        }

        /* Connection Overlay */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 0, 21, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
        }

        input {
            background: none;
            border: 2px solid #f092ff;
            color: #f092ff;
            padding: 15px;
            font-size: 20px;
            text-align: center;
            border-radius: 10px;
            width: 250px;
            margin-bottom: 20px;
            outline: none;
        }

        button {
            background: #f092ff;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        #debug-tilt {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
        }

        #fix-sensors {
            position: absolute;
            top: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #f092ff;
            color: #f092ff;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            display: none;
            z-index: 101;
        }

        #reader-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0015;
            z-index: 2000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #reader {
            width: 300px;
            height: 300px;
            border: 2px solid #0ffffa;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(15, 255, 250, 0.4);
        }

        .scan-btn {
            background: #f092ff !important;
            color: #000 !important;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

    <div id="status">STATUS: STANDBY</div>
    <div id="debug-tilt">Steer: DISCONNECTED</div>
    <button id="fix-sensors" onclick="startGyro()">ENABLE STEERING SENSORS</button>

    <div id="overlay">
        <h1 style="color:#0ffffa; margin-bottom:10px;">DR. CONTROL</h1>
        <p style="font-size:12px; margin-bottom:20px; opacity:0.8;">SCAN OR ENTER LAPTOP ID</p>

        <button class="scan-btn" onclick="startScanning()">🤳 SCAN QR CODE</button>

        <div style="margin: 15px 0; opacity: 0.5;">— OR —</div>

        <input type="text" id="hostIdInput" placeholder="Enter ID (e.g. a1b2)">
        <button onclick="connectToHost()">CONNECT MANUALLY</button>
        <p style="font-size:10px; margin-top:40px; color:#f092ff;">TIP: Make sure Bluetooth or WiFi is on.</p>
    </div>

    <div id="reader-container">
        <h2 style="color:#0ffffa;">POINT AT LAPTOP</h2>
        <div id="reader"></div>
        <button onclick="stopScanning()" style="margin-top:30px; background:rgba(255,255,255,0.1);">CANCEL</button>
    </div>

    <div id="ui-container">
        <div id="wheel-zone">
            <div id="wheel-inner"></div>
        </div>

        <div class="pedal-group">
            <div id="brake" class="pedal"><span class="label">BRAKE</span>BRK</div>
            <div id="gas" class="pedal"><span class="label">GAS</span>GAS</div>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let peer = null, conn = null;
        let gyroActive = false;
        const status = document.getElementById('status');
        const wheelInner = document.getElementById('wheel-inner');
        const tiltDisplay = document.getElementById('debug-tilt');

        // Check for Secure Context (Required for Sensors)
        if (!window.isSecureContext && window.location.hostname !== "localhost") {
            alert("⚠️ WARNING: Sensors might be blocked! \n\nModern phones require HTTPS or 'localhost' (USB wire) for the steering to work. \n\nPlease use the USB WIRE method for best results.");
            tiltDisplay.innerText = "Steer: INSECURE CONTEXT (BLOCKED)";
            tiltDisplay.style.color = "red";
        }

        async function connectToHost() {
            const hostIdInput = document.getElementById('hostIdInput');
            const hostId = hostIdInput.value.trim().toLowerCase();
            if (!hostId) return alert("Please enter the ID seen on your laptop!");

            status.innerText = "STATUS: INITIALIZING PEER...";
            if (peer) peer.destroy();

            peer = new Peer();

            peer.on('open', (id) => {
                status.innerText = "STATUS: SEARCHING FOR LAPTOP (" + hostId + ")...";
                conn = peer.connect(hostId);

                conn.on('open', () => {
                    document.getElementById('overlay').style.display = 'none';
                    document.getElementById('fix-sensors').style.display = 'block';
                    status.innerText = "STATUS: CONNECTED (ACTIVE)";
                    vibrate([50, 50, 50]);
                    setupPedals();
                });

                conn.on('error', (err) => {
                    status.innerText = "STATUS: LINK ERROR (" + err.type + ")";
                    alert("Connection failed: Check if ID is correct.");
                });
            });

            peer.on('error', (err) => {
                status.innerText = "STATUS: DEVICE ERROR (" + err.type + ")";
                if (err.type === 'peer-unavailable') {
                    alert("Laptop not found. Is the 'REMOTE' button active on your laptop?");
                } else {
                    alert("Error: " + err.type);
                }
            });
        }

        // Auto-connect if ID is in URL
        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const hostId = params.get('hostId');
            if (hostId) {
                document.getElementById('hostIdInput').value = hostId;
                // Small delay to ensure PeerJS load if needed
                setTimeout(connectToHost, 500);
            }
        };

        // QR SCANNER LOGIC
        let html5QrCode = null;

        function startScanning() {
            document.getElementById('reader-container').style.display = 'flex';
            html5QrCode = new Html5Qrcode("reader");
            const config = {
                fps: 20,
                qrbox: { width: 280, height: 280 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    // Success!
                    document.getElementById('hostIdInput').value = decodedText.trim().toLowerCase();
                    stopScanning();
                    connectToHost();
                },
                (errorMessage) => {
                    // parse error, ignore it.
                }
            ).catch((err) => {
                alert("Camera error: " + err);
                stopScanning();
            });
        }

        function stopScanning() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('reader-container').style.display = 'none';
                    html5QrCode = null;
                }).catch(() => {
                    document.getElementById('reader-container').style.display = 'none';
                    html5QrCode = null;
                });
            } else {
                document.getElementById('reader-container').style.display = 'none';
            }
        }

        function startGyro() {
            vibrate(50);
            const fixBtn = document.getElementById('fix-sensors');
            fixBtn.innerText = "CALIBRATING...";

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(res => {
                        if (res === 'granted') enableGyro();
                        else {
                            alert("Sensor access denied. Please reset Chrome permissions.");
                            tiltDisplay.innerText = "Steer: PERMISSION DENIED";
                        }
                    })
                    .catch(e => {
                        console.error(id, e);
                        enableGyro();
                    });
            } else {
                enableGyro();
            }
        }

        function enableGyro() {
            const tiltDisplay = document.getElementById('debug-tilt');
            document.getElementById('fix-sensors').style.display = 'none';
            vibrate(50);

            tiltDisplay.innerText = "Steer: READY - WAITING FOR TILT...";
            tiltDisplay.style.color = "#0ffffa";

            let lastEvent = Date.now();
            let checkHeartbeat = setInterval(() => {
                if (Date.now() - lastEvent > 1000) {
                    tiltDisplay.innerText = "Steer: NO DATA (Is tilt enabled?)";
                    tiltDisplay.style.color = "orange";
                }
            }, 1000);

            window.addEventListener('deviceorientation', (e) => {
                lastEvent = Date.now();
                let tilt = -e.gamma;

                const orientation = (screen.orientation && screen.orientation.angle !== undefined)
                    ? screen.orientation.angle
                    : (window.orientation || 0);

                if (orientation === 90) tilt = e.beta;
                if (orientation === -90) tilt = -e.beta;

                if (tilt === null || tilt === undefined || isNaN(tilt)) {
                    tiltDisplay.innerText = "Steer: SENSOR BLOCKED";
                    tiltDisplay.style.color = "red";
                    return;
                }

                const finalTilt = Math.max(-45, Math.min(45, tilt)) * 4;
                if (conn && conn.open) {
                    conn.send({ type: 'gyro', tilt: finalTilt });
                    tiltDisplay.innerText = "Steer: " + Math.round(finalTilt);
                    tiltDisplay.style.color = "#0ffffa";
                }

                wheelInner.style.transform = `translateX(${tilt * 1.5}px)`;
            }, true);
        }

        function setupPedals() {
            const gas = document.getElementById('gas');
            const brake = document.getElementById('brake');

            gas.addEventListener('touchstart', () => { conn.send({ type: 'pedal', pedal: 'fwd', active: true }); vibrate(20); });
            gas.addEventListener('touchend', () => conn.send({ type: 'pedal', pedal: 'fwd', active: false }));

            brake.addEventListener('touchstart', () => { conn.send({ type: 'pedal', pedal: 'bwd', active: true }); vibrate(50); });
            brake.addEventListener('touchend', () => conn.send({ type: 'pedal', pedal: 'bwd', active: false }));
        }

        function vibrate(ms) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>

</html>
